[project]
name = "benchsight"
version = "0.0.1"
description = "Let your coding agent see your workbench: an on-demand camera for Claude Code and other MCP clients, for people building robots and other hardware."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3", "opencv-python-headless>=4.8", "numpy>=1.24"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
benchsight = "benchsight.cli:main"
benchsight-mcp = "benchsight.server:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
